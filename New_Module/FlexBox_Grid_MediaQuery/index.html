<!DOCTYPE html>
<html>
<!-- Please NOTE that the link to assets (like images) need to be set in global context.
For example:
To access an image from assets folder correct way to set src attribute is 

src = 'profile.png'

instead of 

src = './assets/profile.png'
-->

<head>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        .grid-container {
            display: grid;
            height: 100vh;
            grid-template: 20% / auto auto auto;
            grid-template-areas: 'header header' 'nav content' 'nav footer';
        }

        .header {
            background-color: gray;
            grid-area: header;
        }

        .nav {
            background-color: lightgray;
            grid-area: nav;
        }

        .content {
            background-color: lightblue;
            grid-area: content;
        }

        .footer {
            background-color: red;
            grid-area: footer;
        }
    </style>
</head>

<body>
    <div class="grid-container">
        <header class="header">Header</header>
        <nav class="nav">Nav</nav>
        <main class="content">Main Content</main>
        <footer class="footer">Footer</footer>
    </div>
</body>

</html>
